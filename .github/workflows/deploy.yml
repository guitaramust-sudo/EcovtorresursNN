name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: EcovtorresursNN/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: EcovtorresursNN

      - name: Build
        run: npm run build
        working-directory: EcovtorresursNN

      - name: Move files to root # <-- НОВЫЙ ШАГ
        run: |
          mkdir -p public
          cp -r EcovtorresursNN/dist/* public/
          # Если нужен index.html в корне
          cp EcovtorresursNN/dist/index.html ./ || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public" # <-- ИЗМЕНЕНО

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
